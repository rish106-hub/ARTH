name: arth
description: "ARTH - India's First Tax Gap Intelligence App. Not a rupee less. Not a rupee more."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Local persistence
  shared_preferences: ^2.3.1

  # Firebase (using latest compatible set — Spark free tier, India-available)
  firebase_core: ^3.15.1
  firebase_auth: ^5.3.4
  firebase_remote_config: ^5.4.4
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.4
  cloud_firestore: ^5.6.5

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # Sharing & Screenshot
  share_plus: ^13.0.0
  screenshot: ^3.0.0

  # URL launching (action deeplinks)
  url_launcher: ^6.3.0

  # Formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_1024.png"
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#141414"
  image: assets/icon/icon_1024.png
  color_dark: "#141414"
  image_dark: assets/icon/icon_1024.png
  android_12:
    image: assets/icon/icon_foreground.png
    color: "#141414"
    icon_background_color: "#141414"
  web: false
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/tax_data.json
    - assets/lottie/coins.json
    - assets/images/

  # SpaceGrotesk is loaded via google_fonts package at runtime — no local asset needed.
