name: arth
description: "ARTH - Paycheck reconciliation and tax-gap planning for salaried Indians."
publish_to: 'none'
version: 1.0.13+10013

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^17.4.0

  # Local persistence
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^11.0.0

  # Firebase Remote Config
  firebase_core: ^4.13.0
  firebase_remote_config: ^6.5.5
  # Product analytics (event names and bucketed context only — never amounts,
  # merchant names, or anything else that identifies a user or a transaction)
  firebase_analytics: ^12.1.0
  # Push notifications
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0
  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.5.1

  # Sharing & Screenshot
  share_plus: ^13.3.0
  screenshot: ^3.0.0

  # URL launching (action deeplinks)
  url_launcher: ^6.3.0

  # Formatting
  intl: ^0.20.3
  crypto: ^3.0.6

  # Icons
  cupertino_icons: ^1.0.9
  file_selector: ^1.1.0
  google_sign_in: ^7.2.0

  # SMS reading (Android) for on-device spend-map extraction
  another_telephony: ^0.4.1
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.9.1
  pdf: ^3.13.0
  archive: ^4.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_1024.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_1024.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F7F8FA"
  image: assets/icon/icon_1024.png
  color_dark: "#F7F8FA"
  image_dark: assets/icon/icon_1024.png
  android_12:
    image: assets/icon/icon_1024.png
    color: "#F7F8FA"
    icon_background_color: "#F7F8FA"
  web: false
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/tax_data.json
    - assets/tax_rules/
    - assets/employer_playbooks.json
    - assets/lottie/coins.json
    - assets/icon/
    - assets/images/

  fonts:
    - family: Anek
      fonts:
        - asset: assets/fonts/AnekLatin[wdth,wght].ttf
