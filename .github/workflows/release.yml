name: Release — Build & Deploy to Play Store

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # triggers on v1.0.0, v1.2.3, etc.

permissions:
  contents: read

jobs:
  release:
    name: Build Release AAB & Upload to Play Store
    runs-on: ubuntu-latest
    environment: production           # requires manual approval in GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── Secrets injection ─────────────────────────────────────────────────
      # All secrets injected via env: to avoid shell injection.
      # Required GitHub repo secrets (Settings → Secrets → Actions):
      #   GOOGLE_SERVICES_JSON            base64-encoded google-services.json
      #   KEYSTORE_BASE64                 base64-encoded .jks file
      #   KEYSTORE_STORE_PASSWORD         keystore store password
      #   KEYSTORE_KEY_PASSWORD           key password
      #   KEYSTORE_KEY_ALIAS              key alias (e.g. "arth")
      #   PLAY_STORE_SERVICE_ACCOUNT_JSON base64-encoded Play service account
      # ─────────────────────────────────────────────────────────────────────

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES" | base64 --decode > android/app/google-services.json

      - name: Write keystore
        env:
          KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_DATA" | base64 --decode > android/app/arth-release.jks

      - name: Write key.properties
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=app/arth-release.jks
          EOF

      # ── Version from git tag ─────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Build release App Bundle
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: arth-release-${{ steps.version.outputs.name }}
          path: build/app/outputs/bundle/release/app-release.aab

      # ── Deploy to Play Store (internal track) ────────────────────────────
      - name: Upload to Play Store — Internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.arth.taxgap
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
