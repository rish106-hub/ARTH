name: Direct APK Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 1.0.1
        required: true
      version_code:
        description: Increasing Android version code
        required: true
      release_notes:
        description: Short notes shown in ARTH before installation
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.x
          channel: stable
          cache: true

      - name: Validate configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          ARTH_API_BASE_URL: ${{ vars.ARTH_API_BASE_URL }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          missing=0
          for name in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_STORE_PASSWORD KEYSTORE_KEY_PASSWORD KEYSTORE_KEY_ALIAS ARTH_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required"
              missing=1
            fi
          done
          test "$missing" -eq 0
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]

      - name: Install dependencies
        run: flutter pub get

      - name: Write Firebase and signing files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/arth-release.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=arth-release.jks
          EOF

      - name: Build direct APK
        env:
          ARTH_API_BASE_URL: ${{ vars.ARTH_API_BASE_URL }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          flutter build apk --release \
            --flavor internal \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --dart-define=ARTH_API_BASE_URL="$ARTH_API_BASE_URL"

      - name: Verify and prepare release
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          APK="build/app/outputs/flutter-apk/app-internal-release.apk"
          RELEASE_APK="ARTH-$VERSION_NAME.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "$RELEASE_APK"
          SHA256="$(sha256sum "$RELEASE_APK" | cut -d ' ' -f 1)"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION_NAME}/${RELEASE_APK}" \
            --arg sha256 "$SHA256" \
            --arg releaseNotes "$RELEASE_NOTES" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,releaseNotes:$releaseNotes}' \
            > arth-update.json
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          gh release create "v$VERSION_NAME" \
            "ARTH-$VERSION_NAME.apk" \
            "ARTH-$VERSION_NAME.apk.sha256" \
            arth-update.json \
            --title "ARTH $VERSION_NAME" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: arth-direct-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            ARTH-${{ inputs.version_name }}.apk
            ARTH-${{ inputs.version_name }}.apk.sha256
            arth-update.json
          retention-days: 30
