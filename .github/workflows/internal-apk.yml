name: Internal APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 1.0.0
        required: true
        default: 1.0.0
      version_code:
        description: Increasing Android version code
        required: true
        default: "10000"

permissions:
  contents: read

jobs:
  build:
    name: Build signed internal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.x
          channel: stable
          cache: true

      - name: Validate build configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          ARTH_API_BASE_URL: ${{ vars.ARTH_API_BASE_URL }}
        run: |
          missing=0
          for name in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_STORE_PASSWORD KEYSTORE_KEY_PASSWORD KEYSTORE_KEY_ALIAS ARTH_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required"
              missing=1
            fi
          done
          test "$missing" -eq 0
          [[ "${{ inputs.version_code }}" =~ ^[0-9]+$ ]]

      - name: Install dependencies
        run: flutter pub get

      - name: Write Firebase and signing files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/arth-release.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/arth-release.jks
          EOF

      - name: Build internal APK
        env:
          ARTH_API_BASE_URL: ${{ vars.ARTH_API_BASE_URL }}
        run: |
          flutter build apk --release \
            --flavor internal \
            --build-name="${{ inputs.version_name }}" \
            --build-number="${{ inputs.version_code }}" \
            --dart-define=ARTH_API_BASE_URL="$ARTH_API_BASE_URL"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-internal-release.apk

      - name: Upload internal APK
        uses: actions/upload-artifact@v7
        with:
          name: arth-internal-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: build/app/outputs/flutter-apk/app-internal-release.apk
          retention-days: 30
